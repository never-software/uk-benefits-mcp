name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: >-
          python -m pip install .
          'build>=1.3,<2'
          'pyright>=1.1.405'
          'pytest>=8.4,<10'
          'pytest-asyncio>=1.2,<2'
          'respx>=0.22,<1'
          'ruff>=0.13,<1'
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest -m "not live"
      - if: matrix.python-version == '3.14'
        run: python -m build
